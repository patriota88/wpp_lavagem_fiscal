<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tablet Fiscal</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main id="app" class="app hidden" aria-hidden="true">
		<section class="tablet-shell" role="dialog" aria-label="Tablet Fiscal">
			<button id="closeButton" class="close-button" type="button" aria-label="Fechar tablet">X</button>

			<!-- INICIO: CABECALHO DO DASHBOARD -->
			<header class="header">
				<h1 id="empresaNome">Empresa</h1>
			</header>

			<!-- INICIO: CARD DE PAINEL FINANCEIRO -->
			<section class="balance-card" aria-label="Painel financeiro da lavagem">
				<div class="triple-panel">
					<div class="panel-item">
						<p class="label">Caixa da Empresa (25%)</p>
						<p id="saldoEmpresa" class="value panel-value">R$ 0</p>
					</div>
					<div class="panel-item">
						<p class="label">Dividendos do Cliente (75%)</p>
						<p id="saldoCliente" class="value panel-value">R$ 0</p>
					</div>
					<div class="panel-item">
						<p class="label">Total Historico Lavado</p>
						<p id="totalLavado" class="value panel-value">R$ 0</p>
					</div>
				</div>
				<p class="label timer-label">Tempo Restante de Lavagem</p>
				<p id="tempoRestante" class="value timer-value">00:00</p>
			</section>

			<!-- INICIO: TABELA DE FUNCIONARIOS FANTASMAS -->
			<section class="table-section" aria-label="Relatorio de funcionarios fantasmas">
				<div class="table-title-row">
					<h2>Funcionarios Fantasmas</h2>
					<span class="table-subtitle">Ultima distribuicao registrada</span>
				</div>

				<div class="table-wrapper">
					<table>
						<thead>
							<tr>
								<th>Nome</th>
								<th>Pagamento</th>
							</tr>
						</thead>
						<tbody id="funcionariosTableBody">
							<tr>
								<td colspan="2" class="empty-row">Sem dados no momento.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>

			<!-- INICIO: ACOES DO DASHBOARD -->
			<footer class="actions">
				<button id="withdrawCompanyButton" class="withdraw-button" type="button">
					Sacar Caixa da Empresa
				</button>
				<button id="withdrawDividendButton" class="withdraw-button" type="button">
					Sacar Dividendos
				</button>
			</footer>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
